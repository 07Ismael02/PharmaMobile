name: iOS simulator tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/clean-mvvm
    paths:
      - "shared/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - ".github/workflows/ios-tests.yml"

permissions:
  contents: read

jobs:
  ios-tests:
    name: iosSimulatorArm64Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run iOS simulator tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test \
            --rerun-tasks \
            --console=plain \
            --info | tee ios-test-output.log

          if ! grep -E "> Task :shared:iosSimulatorArm64Test($| )" ios-test-output.log; then
            echo "::error::Gradle did not report execution of iosSimulatorArm64Test."
            exit 1
          fi

          if grep -E "> Task :shared:iosSimulatorArm64Test SKIPPED|Skipping task ':shared:iosSimulatorArm64Test'" ios-test-output.log; then
            echo "::error::iosSimulatorArm64Test was skipped instead of executed."
            exit 1
          fi
